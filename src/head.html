<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#0b1a33">
<title>星钥天文馆 · 闭馆谜影</title>
<style>
:root{--ink:#e8eef8;--ink2:#9ab0c8;--pink:#6ec8ff;--pink2:#1a3a55;--purple:#8e6bff;--purple2:#2a2450;--mint:#22b88a;--mint2:#14352c;--sun:#ffc23c;--sun2:#3a3010;--sky:#4d9bff;--sky2:#143050;--coral:#ff7b6b;--card:#152238;--r:20px;--shadow:0 6px 18px rgba(0,20,40,.35)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;min-height:100%;overflow-x:hidden}
body{font-family:"PingFang SC","Hiragino Sans GB","Microsoft YaHei","Noto Sans CJK SC","Source Han Sans SC",sans-serif;color:var(--ink);background:linear-gradient(165deg,#070e1c 0%,#0b1a33 45%,#122848 100%) fixed;-webkit-user-select:none;user-select:none;overscroll-behavior-y:auto}
button{font-family:inherit;color:inherit;border:0;cursor:pointer;touch-action:manipulation;background:none}
button:focus-visible{outline:3px solid var(--purple);outline-offset:2px}
h1,h2,h3,p{margin:0}
.screen{display:none;min-height:100vh;min-height:100dvh}
.screen.active{display:block;animation:fadein .25s ease}
@keyframes fadein{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.wrap{max-width:1040px;margin:0 auto;padding:12px 14px 28px}
.card{background:var(--card);border-radius:var(--r);box-shadow:var(--shadow);padding:14px}
.btn{border-radius:16px;padding:12px 18px;font-size:17px;font-weight:800;background:#1c2e48;box-shadow:0 4px 0 rgba(0,0,0,.25);transition:transform .08s;min-height:48px;display:inline-flex;align-items:center;justify-content:center;gap:6px;color:var(--ink)}
.btn:active{transform:translateY(3px);box-shadow:0 1px 0 rgba(0,0,0,.25)}
.btn.primary{background:linear-gradient(180deg,#5eb0ff,#2a7fd4);color:#fff;box-shadow:0 5px 0 #1a5a9a}
.btn.purple{background:linear-gradient(180deg,#a68bff,#7f5cff);color:#fff;box-shadow:0 5px 0 #6243d6}
.btn.mint{background:linear-gradient(180deg,#46d6aa,#1fb185);color:#fff;box-shadow:0 5px 0 #188d69}
.btn.sun{background:linear-gradient(180deg,#ffd76a,#ffb820);color:#6b4a00;box-shadow:0 5px 0 #d99500}
.btn.ghost{background:rgba(255,255,255,.08)}
.btn.coral{background:linear-gradient(180deg,#ff9a8b,#ff6b5a);color:#fff;box-shadow:0 5px 0 #d94a3a}
.btn[disabled]{opacity:.45;pointer-events:none}
.iconbtn{width:46px;height:46px;border-radius:15px;background:rgba(255,255,255,.1);display:inline-flex;align-items:center;justify-content:center;box-shadow:0 3px 0 rgba(0,0,0,.2);font-size:22px;flex:none}
.tag{display:inline-block;font-size:12px;font-weight:800;padding:3px 9px;border-radius:999px;background:var(--purple2);color:#cbb8ff;white-space:nowrap}
.stars{display:inline-flex;gap:2px;vertical-align:middle}.stars svg{width:18px;height:18px}
.topbar{position:sticky;top:0;z-index:20;display:flex;align-items:center;gap:8px;padding:10px 12px;background:rgba(8,16,32,.92);backdrop-filter:blur(6px);box-shadow:0 2px 10px rgba(0,0,0,.25)}
.topbar .ttl{flex:1;min-width:0;font-size:18px;font-weight:900;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.topbar .ttl small{display:block;font-size:12px;font-weight:700;color:var(--ink2)}
.hintbtn{height:46px;border-radius:15px;padding:0 12px;background:linear-gradient(180deg,#ffe58a,#ffc93c);box-shadow:0 3px 0 #dba21a;font-weight:900;font-size:16px;display:inline-flex;align-items:center;gap:4px;flex:none;color:#6b4a00}
.home-head{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:6px 2px 4px}
.logo{font-size:26px;font-weight:900;letter-spacing:1px;background:linear-gradient(90deg,#6ec8ff,#8e6bff 55%,#ffc23c);-webkit-background-clip:text;background-clip:text;color:transparent}
.sub{color:var(--ink2);font-size:14px;margin-top:2px}
.starpill{display:inline-flex;align-items:center;gap:4px;background:#1c2e48;border-radius:999px;padding:6px 12px;font-weight:900;box-shadow:var(--shadow)}
.starpill svg{width:20px;height:20px}
.mascot{display:flex;align-items:center;gap:10px;margin:12px 0}
.mascot .face{font-size:46px;flex:none;animation:bob 2.4s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(-5px)}}
.bubble{background:#1c2e48;border-radius:16px;padding:10px 14px;font-size:15px;box-shadow:var(--shadow);position:relative;line-height:1.5}
.prog-banner{background:linear-gradient(135deg,#2a6aad,#5b3fd6);color:#fff;border-radius:20px;padding:14px 16px;box-shadow:0 6px 0 rgba(0,0,0,.2),var(--shadow);margin-bottom:14px}
.prog-banner b{font-size:22px;display:block}
.prog-banner span{font-size:14px;opacity:.95}
.list-intro{margin:4px 2px 12px;color:var(--ink2);font-size:14px;line-height:1.5}
.chapters{display:flex;flex-wrap:wrap;gap:8px;margin:0 0 12px}
.big-grid{display:grid;grid-template-columns:1fr;gap:10px}
@media(min-width:700px){.big-grid{grid-template-columns:1fr 1fr}}
@media(min-width:1000px){.big-grid{grid-template-columns:1fr 1fr 1fr}}
.room-list-hint{text-align:center;font-size:13px;font-weight:800;color:#7eb8e0;margin:0 0 8px;line-height:1.4}
.room-list-panel{padding:6px 4px 28px;margin:0 -2px 4px;border-radius:18px;background:rgba(255,255,255,.04)}
.big{display:flex;align-items:center;gap:12px;background:#1c2e48;border-radius:18px;padding:10px 12px;box-shadow:0 4px 0 rgba(0,0,0,.2);text-align:left;min-height:72px;width:100%;color:var(--ink)}
.big .bi{font-size:32px;width:54px;height:54px;border-radius:16px;background:#243858;display:flex;align-items:center;justify-content:center;flex:none}
.big b{font-size:17px;display:block}
.big small{display:block;color:var(--ink2);font-size:12px;margin-top:2px}
.big .r{margin-left:auto;text-align:right;flex:none}
.big.locked{opacity:.55}
.big.locked .bi{filter:grayscale(1)}
.hub-entry .btn small{font-size:12px;display:block;margin-top:4px}
.num-cards{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;margin:14px 0}
.num-card{width:64px;height:64px;border-radius:16px;background:linear-gradient(180deg,#1c2e48,#243858);box-shadow:0 4px 0 rgba(0,0,0,.25);font-size:28px;font-weight:900;display:flex;align-items:center;justify-content:center;color:#fff}
.num-card.used{opacity:.35}
.num-ops{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin:10px 0}
.num-ops .btn{min-width:52px}
.num-expr{text-align:center;font-size:22px;font-weight:900;min-height:36px;margin:8px 0;word-break:break-all}
.home-foot{margin-top:16px;text-align:center;color:var(--ink2);font-size:13px;line-height:1.6}
.home-reset{margin:10px 0 12px;display:flex;justify-content:center;gap:8px;flex-wrap:wrap}
.home-reset .btn{min-height:44px;padding:10px 14px;font-size:14px;border:2px dashed #3a5070;background:#152238;color:#9ab0c8;box-shadow:none}
.mask{position:fixed;inset:0;background:rgba(0,10,30,.55);z-index:50;display:none;align-items:flex-end;justify-content:center}
.mask.show{display:flex;animation:fadein .2s}
.sheet{background:#152238;width:100%;max-width:560px;max-height:88vh;max-height:88dvh;overflow:auto;border-radius:26px 26px 0 0;padding:16px 16px calc(18px + env(safe-area-inset-bottom));box-shadow:0 -8px 30px rgba(0,0,0,.35);color:var(--ink)}
@media(min-width:700px){.mask{align-items:center}.sheet{border-radius:26px}}
.sheet-h{display:flex;align-items:center;gap:8px;margin-bottom:10px}
.sheet-h h3{flex:1;font-size:20px;font-weight:900}
.xbtn{width:42px;height:42px;border-radius:14px;background:#243858;font-size:20px;font-weight:900;flex:none;color:var(--ink)}
.say{font-size:16px;line-height:1.65}
.note{margin:10px 0;background:#1a2838;border:2px dashed #3a6080;border-radius:14px;padding:12px 14px;font-size:16px;line-height:1.75;white-space:pre-line;color:#c8d8e8}
.banner{background:var(--mint2);color:#7ddcc0;border-radius:14px;padding:10px 12px;font-weight:800;font-size:15px;margin-bottom:10px;line-height:1.5}
.banner.bad{background:#3a2020;color:#ff9a8b}
.actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:12px}
.actions .btn{flex:1;min-width:120px}
.gnote{font-size:13px;color:var(--ink2);line-height:1.5;margin:6px 0}
.lock{margin-top:12px;background:#1c2e48;border-radius:18px;padding:12px;box-shadow:inset 0 0 0 2px #2a4060}
.lock-p{font-size:14px;color:var(--ink2);font-weight:700;text-align:center;margin-bottom:8px}
.codebox{display:flex;justify-content:center;gap:8px;margin-bottom:10px}
.codebox span{width:46px;height:54px;border-radius:12px;background:#0e1a2c;border:3px solid #2a4060;display:flex;align-items:center;justify-content:center;font-size:26px;font-weight:900;color:var(--ink)}
.codebox span.f{border-color:var(--purple);background:#1a1535}
.pad{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;max-width:330px;margin:0 auto}
.pad button,.kb button{background:#243858;border-radius:14px;min-height:50px;font-size:22px;font-weight:900;box-shadow:0 3px 0 #0e1a2c;color:var(--ink)}
.pad button:active,.kb button:active{transform:translateY(2px);box-shadow:none}
.kb{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;max-width:420px;margin:0 auto}
.kb button{min-height:46px;font-size:19px}
.dials{display:flex;justify-content:center;gap:16px}
.dial{display:flex;flex-direction:column;align-items:center;gap:6px}
.dial .ch{width:68px;height:72px;border-radius:16px;background:#2a2440;border:3px solid #8e6bff;display:flex;align-items:center;justify-content:center;font-size:38px;font-weight:900;font-family:"Noto Serif CJK SC","Songti SC",serif}
.dial button{width:68px;height:44px;border-radius:12px;background:#243858;font-size:20px;box-shadow:0 3px 0 #0e1a2c;color:var(--ink)}
.choices{display:flex;justify-content:center;gap:12px;flex-wrap:wrap}
.choices button{width:66px;height:66px;border-radius:16px;box-shadow:0 4px 0 rgba(0,0,0,.18);border:3px solid rgba(255,255,255,.2)}
.lock .ok{width:100%;margin-top:10px}
.room-wrap{max-width:1040px;margin:0 auto;padding:10px 12px 24px;display:grid;gap:10px}
@media(min-width:900px){.room-wrap{grid-template-columns:1.7fr 1fr;align-items:start}}
.scene-box{background:#0e1a2c;border-radius:20px;box-shadow:var(--shadow);overflow:hidden;line-height:0;position:relative}
#scene{width:100%;height:auto;display:block;aspect-ratio:4/3}
#scene .obj,#scene .hit{cursor:pointer}
#scene .obj:hover{filter:brightness(1.08)}
#scene .hl{fill:none;stroke:#ffcf00;stroke-width:4;stroke-dasharray:8 6;animation:dash 1s linear infinite;pointer-events:none}
@keyframes dash{to{stroke-dashoffset:-28}}
.msg{background:#1c2e48;border-radius:16px;padding:12px 14px;font-size:15px;line-height:1.6;box-shadow:var(--shadow);min-height:52px}
.inv-h{display:flex;align-items:center;justify-content:space-between;font-weight:900;font-size:15px;margin:2px 4px}
.inv-h small{font-weight:700;color:var(--ink2);font-size:12px}
.inv{display:grid;grid-template-columns:repeat(5,1fr);gap:8px}
.slot{background:rgba(255,255,255,.06);border-radius:14px;min-height:64px;display:flex;flex-direction:column;align-items:center;justify-content:center;border:3px solid transparent;padding:4px 2px;box-shadow:0 3px 0 rgba(0,0,0,.15);color:var(--ink)}
.slot .ic{font-size:28px;line-height:1.1}
.slot .nm{font-size:11px;font-weight:700;color:var(--ink2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}
.slot.empty{background:rgba(255,255,255,.03);box-shadow:none}
.slot.sel{border-color:#6ec8ff;background:#1a3050;transform:translateY(-3px)}
.slot.glow .ic{filter:drop-shadow(0 0 6px #ffd23f)}
.side{display:flex;flex-direction:column;gap:10px}
.room-tools{display:flex;gap:8px}
.room-tools .btn{flex:1;font-size:15px;min-height:44px;padding:8px}
.story p{font-size:16px;line-height:1.75;margin-bottom:6px}
.win{text-align:center}
.win .wt{font-size:24px;font-weight:900;margin:6px 0}
.win .bigstars{display:flex;justify-content:center;gap:8px;margin:8px 0}
.win .bigstars svg{width:56px;height:56px;transform:scale(0);animation:pop .4s ease forwards}
.win .bigstars svg:nth-child(2){animation-delay:.2s}.win .bigstars svg:nth-child(3){animation-delay:.4s}
@keyframes pop{70%{transform:scale(1.2)}to{transform:scale(1)}}
.win .ws{color:var(--ink2);font-size:14px;margin-bottom:8px}
.explain{text-align:left;background:#1c2e48;border-radius:16px;padding:12px 14px;margin-top:10px;box-shadow:inset 0 0 0 2px #2a4060}
.explain h4{margin:0 0 6px;font-size:16px}
.explain ol{margin:0;padding-left:22px;font-size:15px;line-height:1.7}
.ending{background:#2a2440;border-radius:14px;padding:10px 12px;font-size:15px;line-height:1.6;margin-top:10px;text-align:left}
.hint-list{display:flex;flex-direction:column;gap:8px}
.hint-item{background:#2a2440;border-radius:14px;padding:10px 12px;font-size:16px;line-height:1.6}
.hint-item b{color:#ffc23c}
.hint-cost{font-size:13px;color:var(--ink2);margin-top:8px;text-align:center}
#toast{position:fixed;left:50%;bottom:28px;transform:translate(-50%,30px);background:rgba(10,30,60,.95);color:#fff;padding:12px 18px;border-radius:16px;font-size:15px;font-weight:700;z-index:80;opacity:0;pointer-events:none;transition:.25s;max-width:calc(100vw - 32px);text-align:center;line-height:1.5}
#toast.show{opacity:1;transform:translate(-50%,0)}
.confetti{position:fixed;top:-20px;width:10px;height:14px;z-index:90;pointer-events:none;animation:fall linear forwards;border-radius:2px}
@keyframes fall{to{transform:translateY(110vh) rotate(720deg)}}
.shake{animation:shake .4s}
@keyframes shake{20%,60%{transform:translateX(-6px)}40%,80%{transform:translateX(6px)}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<section class="screen active" id="scr-home"><div class="wrap">
  <div class="home-head"><div><div class="logo">星钥天文馆</div><div class="sub">闭馆谜影 · 悬疑密室（全新主线）</div></div>
    <div style="display:flex;gap:8px;align-items:center"><span class="starpill" id="homeStars"></span><button class="iconbtn" data-act="mute" aria-label="声音开关"></button></div></div>
  <div class="mascot"><div class="face">🔭</div><div class="bubble" id="owlSay">闭馆夜，你被反锁在星钥天文馆。顺着白墨的线索，天亮前打开潮汐门——并弄清白墨是谁。</div></div>
  <div class="hub-entry" style="display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:0 0 14px">
    <button class="btn primary" data-act="modeMystery" type="button" style="flex-direction:column;min-height:72px;padding:12px">🕵️ 悬疑密室<br><small style="font-weight:700;opacity:.9">10 间深场景</small></button>
    <button class="btn purple" data-act="modeNum" type="button" style="flex-direction:column;min-height:72px;padding:12px">🔢 数字游戏<br><small style="font-weight:700;opacity:.9">轻松 24 点</small></button>
  </div>
  <div id="mysteryBlock">
  <div class="prog-banner"><b id="progText">已逃出 0 / 10 间</b><span>一条主线 · 循序解锁 · 密码藏在场景证据里</span></div>
  <p class="list-intro" id="listIntro">点场景物件找线索；拿道具、读铭牌/告示、开锁、组合。假标签和干扰涂鸦也会出现——像真的密室一样。</p>
  <div id="listBody"></div>
  </div>
  <div class="home-foot">存档 key：xingyue_escape_v1（与旧 mishi 互不影响）· 卡住了点「💡 提示」</div>
</div></section>
<section class="screen" id="scr-num"><div class="wrap">
  <div class="topbar" style="position:static;margin:0 -14px 12px;border-radius:0"><button class="iconbtn" data-act="home" aria-label="返回">←</button><div class="ttl">🔢 数字游戏 · 24 点<small>用四个数算出 24</small></div><button class="iconbtn" data-act="mute" aria-label="声音开关"></button></div>
  <div class="card" id="numGameBody"></div>
</div></section>
<section class="screen" id="scr-room">
  <div class="topbar"><button class="iconbtn" data-act="back" aria-label="返回">←</button><div class="ttl" id="roomTitle"></div><button class="hintbtn" data-act="hint">💡 提示</button><button class="iconbtn" data-act="mute" aria-label="声音开关"></button></div>
  <div class="room-wrap">
    <div class="scene-box"><svg id="scene" viewBox="0 0 400 300" role="img" aria-label="房间场景"></svg></div>
    <div class="side">
      <div class="msg" id="roomMsg"></div>
      <div class="inv-h">🎒 物品栏 <small id="invTip">点物品可以选中它</small></div>
      <div class="inv" id="inv"></div>
      <div class="room-tools"><button class="btn ghost" data-act="story">📖 看故事</button><button class="btn ghost" data-act="roomReset">🔄 重新开始</button></div>
    </div>
  </div>
</section>
<div class="mask" id="mask"><div class="sheet" id="sheet" role="dialog" aria-modal="true"></div></div>
<div id="toast"></div>
<script>
